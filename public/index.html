<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>InstaCheck — Анализ профиля</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #121212;
      --border: #2a2a2a;
      --text: #ffffff;
      --text-muted: #888888;
      --accent: #0a84ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { 
      background: var(--bg); 
      color: var(--text); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh; 
      padding: 40px 20px; 
    }
    
    .container { width: 100%; max-width: 500px; }
    
    .logo { font-size: 24px; font-weight: 800; margin-bottom: 30px; text-align: center; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }

    .search-box { 
      display: flex; 
      background: var(--surface); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      overflow: hidden; 
      margin-bottom: 30px;
    }
    .search-box input { 
      flex: 1; 
      background: none; 
      border: none; 
      padding: 16px; 
      color: var(--text); 
      font-size: 16px; 
      outline: none; 
    }
    .search-box button { 
      background: var(--accent); 
      color: white; 
      border: none; 
      padding: 0 24px; 
      font-weight: 600; 
      font-size: 16px; 
      cursor: pointer; 
      transition: opacity 0.2s;
    }
    .search-box button:active { opacity: 0.7; }

    /* Карточка профиля */
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: none; /* Скрыта до поиска */
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }
    .info h2 { font-size: 20px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .info p { color: var(--text-muted); font-size: 14px; }
    .verified { color: var(--accent); font-size: 16px; }

    .bio { font-size: 14px; line-height: 1.5; color: #cccccc; margin-bottom: 20px; white-space: pre-wrap; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-val { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Лоадер и ошибки */
    .spinner { display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .error { display: none; color: #ff453a; background: rgba(255,69,58,0.1); border: 1px solid rgba(255,69,58,0.3); padding: 16px; border-radius: 12px; text-align: center; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">Insta<span>Check</span></div>

    <div class="search-box">
      <input type="text" id="username" placeholder="Введите @username" value="nasa" autocomplete="off">
      <button onclick="analyze()" id="searchBtn">Поиск</button>
    </div>

    <div id="loader" class="spinner"></div>
    <div id="error" class="error"></div>

    <div class="profile-card" id="profileCard">
      <div class="profile-header">
        <img id="avatar" class="avatar" src="" alt="Avatar">
        <div class="info">
          <h2><span id="fullName"></span> <span id="verified" class="verified" style="display:none;">✔</span></h2>
          <p>@<span id="usernameDisplay"></span></p>
        </div>
      </div>
      
      <div class="bio" id="bio"></div>

      <div class="stats">
        <div class="stat-box">
          <div class="stat-val" id="followers">-</div>
          <div class="stat-label">Подписчики</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="following">-</div>
          <div class="stat-label">Подписки</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function analyze() {
      const u = document.getElementById('username').value.trim().replace('@', '');
      if (!u) return;

      const btn = document.getElementById('searchBtn');
      const loader = document.getElementById('loader');
      const errorBox = document.getElementById('error');
      const card = document.getElementById('profileCard');

      // Сброс UI
      card.style.display = 'none';
      errorBox.style.display = 'none';
      loader.style.display = 'block';
      btn.innerText = '...';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/analyze?username=${u}`);
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Ошибка запроса');

        // Подставляем данные в карточку
        document.getElementById('fullName').innerText = data.full_name || data.username || u;
        document.getElementById('usernameDisplay').innerText = data.username || u;
        document.getElementById('bio').innerText = data.biography || 'Био отсутствует';
        document.getElementById('followers').innerText = Number(data.followers || data.follower_count || 0).toLocaleString('ru-RU');
        document.getElementById('following').innerText = Number(data.following || data.following_count || 0).toLocaleString('ru-RU');
        
        if (data.is_verified) document.getElementById('verified').style.display = 'inline';
        else document.getElementById('verified').style.display = 'none';

        // Умный парсер аватарки
        const pic = data.profile_pic_url_hd || data.profile_pic_url || data.avatar || data.profilePicUrl;
        document.getElementById('avatar').src = pic || `https://ui-avatars.com/api/?name=${u}&background=121212&color=fff`;

        // Показываем карточку
        card.style.display = 'block';

      } catch (err) {
        errorBox.innerText = err.message;
        errorBox.style.display = 'block';
      } finally {
        loader.style.display = 'none';
        btn.innerText = 'Поиск';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
